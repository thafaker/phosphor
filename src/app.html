<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#07110b" />
		<meta name="description" content="Phosphor — ein schlankes Web-Frontend für GoToSocial." />
		<script>
			// Apply the saved appearance before first paint to avoid a flash of the
			// wrong theme. Kept inline and dependency-free on purpose.
			(function () {
				try {
					var prefs = JSON.parse(localStorage.getItem('phosphor:prefs:v1') || '{}');
					var theme = prefs.theme || 'system';
					var resolved =
						theme === 'system'
							? window.matchMedia('(prefers-color-scheme: light)').matches
								? 'light'
								: 'dark'
							: theme;
					var root = document.documentElement;
					root.dataset.theme = resolved;
					root.dataset.motion = prefs.motion === 'reduce' ? 'reduce' : 'system';
					root.style.setProperty('--text-scale', String(prefs.textScale || 1));
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', resolved === 'light' ? '#f5fbf8' : '#07110b');
				} catch (e) {
					/* ignore */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
